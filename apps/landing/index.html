          "@type": "FAQPage",
          "@id": "https://splitwiser.app/#faq",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "Is Splitwiser really 100% free?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes, completely free forever. Splitwiser is open-source under the MIT license. There are no subscriptions, no 'Pro' paywalls, no daily limits on how many expenses or receipts you can add, and no 10-second artificial countdown timers."
              }
            },
            {
              "@type": "Question",
              "name": "Do my friends need an account or app download to join?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No! Unlike other split apps that force everyone to download a 100MB app and register an email, Splitwiser is guest-first. You send an invite link (via WhatsApp, iMessage, Signal, or SMS); your friends open it in their browser, pick their name, and immediately view or add expenses."
              }
            },
            {
              "@type": "Question",
              "name": "How do I install it on my iPhone or Android device?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Splitwiser is built as an installable Progressive Web App (PWA). On iOS Safari, tap the Share icon and tap 'Add to Home Screen'. On Android Chrome, tap 'Install app' from the banner or browser menu. It opens in full-screen standalone mode with offline support."
              }
            },
            {
              "@type": "Question",
              "name": "How does debt simplification work?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "When multiple friends pay for different things (e.g. Alice pays for dinner, Bob buys drinks, Charlie pays for gas), Splitwiser calculates each person's net balance and computes the mathematical minimum number of transfers to settle the entire group, eliminating messy circular repayments."
              }
            },
            {
              "@type": "Question",
              "name": "Can I self-host Splitwiser on my own domain?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes! The entire stack is built on Cloudflare Workers, Cloudflare D1 (SQL edge database), and Cloudflare Pages. It runs easily within Cloudflare's generous $0/month free tier. We provide complete OpenTofu/Terraform infrastructure scripts in the GitHub repo."
              }
            },
            {
              "@type": "Question",
              "name": "How is Splitwiser funded?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Splitwiser is an open-source passion project built for the community. The serverless architecture costs $0 to run. If you find it helpful and want to support domain costs and ongoing development, you can buy us a coffee using the button on the site."
              }
            }
          ]
