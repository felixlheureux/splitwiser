<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d9488" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Splitwiser" />
    <meta name="description" content="A simple place for the expenses you share." />
    <meta name="referrer" content="no-referrer" />
    <title>Splitwiser</title>
    <script>
      window.__deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__deferredPrompt = e;
        window.dispatchEvent(new Event('pwa-prompt-ready'));
      });
    </script>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        background-color: #f1f5f9;
      }
      .app-splash-container {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .splash-badge {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%);
        box-shadow: 0 10px 25px -5px rgba(13, 148, 136, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 32px;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: -0.05em;
        user-select: none;
        animation: splash-pulse 1.8s ease-in-out infinite;
      }
      @keyframes splash-pulse {
        0%, 100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(0.96);
          opacity: 0.85;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-splash-container">
        <div class="splash-badge">s.</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
